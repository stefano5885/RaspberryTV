<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaspberryTV · Aggiornamento</title>
  <style>
    :root { color-scheme:dark; --cyan:#3be8ff; --green:#68ff9b; --muted:#6e8295; --red:#ff647c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:#05080c; color:#d9e7f1; font-family:"DejaVu Sans Mono","Liberation Mono",monospace; }
    body::before { content:""; position:fixed; inset:0; background-image:linear-gradient(rgb(59 232 255 / 5%) 1px,transparent 1px),linear-gradient(90deg,rgb(59 232 255 / 5%) 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(circle,black,transparent 72%); }
    main { position:relative; width:min(760px,calc(100% - 56px)); padding:42px; border:1px solid #24485b; border-left:4px solid var(--cyan); background:#081018; box-shadow:0 0 90px rgb(0 196 255 / 10%); }
    .top { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; letter-spacing:.14em; }
    .mark { width:54px; height:54px; margin:64px 0 28px; border:2px solid var(--cyan); animation:spin 2.4s steps(8,end) infinite; }
    .mark::after { content:""; display:block; width:14px; height:14px; margin:18px; background:var(--cyan); box-shadow:0 0 24px var(--cyan); }
    h1 { margin:0; font-size:clamp(34px,7vw,68px); line-height:.95; letter-spacing:-.065em; }
    #message { min-height:1.5em; margin-top:24px; color:var(--green); font-size:15px; }
    .track { height:3px; margin-top:42px; background:#102331; overflow:hidden; }
    .track::after { content:""; display:block; width:32%; height:100%; background:var(--green); box-shadow:0 0 14px var(--green); animation:scan 1.3s ease-in-out infinite; }
    .note { color:var(--muted); font-size:12px; }
    button { display:none; margin-top:24px; padding:13px 18px; color:#021015; border:0; background:var(--cyan); font:700 13px/1 monospace; }
    body.failed main { border-left-color:var(--red); } body.failed #message { color:var(--red); } body.failed button { display:block; }
    @keyframes scan { from { transform:translateX(-110%); } to { transform:translateX(320%); } }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="top"><span>RASPBERRYTV / MAINTENANCE</span><span id="status">QUEUED</span></div>
    <div class="mark" aria-hidden="true"></div>
    <h1>Aggiornamento<br>in corso</h1>
    <p id="message">Preparazione del sistema…</p>
    <div class="track"></div>
    <p class="note">Non togliere alimentazione. Il kiosk verrà riavviato automaticamente.</p>
    <button id="return" type="button">TORNA AL SITO</button>
  </main>
  <script>
    const terminal = new Set(["failed", "no_change"]);
    async function poll() {
      try {
        const response = await fetch("/api/status", { cache:"no-store" });
        if (!response.ok) throw new Error();
        const data = await response.json();
        const update = data.update || {};
        document.querySelector("#status").textContent = String(update.status || "working").toUpperCase();
        document.querySelector("#message").textContent = update.message || "Operazione in corso…";
        document.body.classList.toggle("failed", update.status === "failed");
        if (terminal.has(update.status)) return;
      } catch (_) {
        document.querySelector("#message").textContent = "Riavvio dei servizi in corso…";
      }
      setTimeout(poll, 1000);
    }
    document.querySelector("#return").addEventListener("click", () => fetch("/api/browser/site", { method:"POST", headers:{"Content-Type":"application/json"}, body:"{}" }));
    poll();
  </script>
</body>
</html>
